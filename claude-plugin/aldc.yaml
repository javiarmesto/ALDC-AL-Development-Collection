# ALDC — Claude Code plugin configuration.
# Maintained in this plugin (see SURFACE.md). Hooks and tools read it when the project has
# no aldc.yaml of its own; a project aldc.yaml takes precedence (/aldc:al-initialize does
# not copy this file).
#
# Work products live under .claude/ in a Claude Code deployment: requirement artifacts
# in .claude/plans (plans.root) and audit reports in .claude/audits (audits.root).
# The canonical repository file keeps .github/, which is correct for the Copilot
# deployment and the VS Code extension package.

# ALDC Core Configuration v1.2 (contract version; product version is in package.json)
# Skills-based modularization with preserved orchestration + per-requirement contracts + global memory

core:
  version: "1.2.0"

toolkitRoot: "."

# Multi-root layout of this AL solution. Paths are relative to this file; an empty
# value means the solution has no such folder yet. The BCQuality root is not declared
# here; it comes from external.bcquality when the mode is external-multiroot, so the
# location is stated once.
solution:
  roots:
    application: ""
    test: ""

# aldc-claude: autonomy of the human gates (plan approval, phase checkpoints, handoffs).
#   human        - default. Agents stop at every gate and wait for explicit approval.
#   pre-approved - the requester approved in advance (headless runs, CI, evals). Gates
#                  become recorded checkpoints in <plans.root>/<req>/decisions.md and
#                  the work continues. Hard stops (⛔) still stop.
# Override per run with the environment variable ALDC_GATES=human|pre-approved.
# commit: false keeps git commits as a human step even in pre-approved mode.
autonomy:
  gates: "human"
  record: true
  commit: false

# aldc-claude: how this project runs its AL tests on a real Business Central.
# runner: a shell command run from the project root after each phase compiles; it must
#   print PASS/FAIL per test and exit non-zero on failure (for example the L4 runner of
#   aldc-claude evals against a sandbox). Empty = tests are compiled but not executed,
#   and the final report says so. Override per run with ALDC_TEST_RUNNER.
#   Never point it at a production environment.
testing:
  runner: ""

# External citable knowledge base: an audit/citation layer for al-reviewer (phase,
# increment and audit scopes) and Triage (al-code-review), and design knowledge for Architect, Spec and Conductor through
# al-knowledge-consultant (al-knowledge). Does NOT replace instructions or skills.
external:
  bcquality:
    # aldc-claude: plugin by default. In Claude Code BCQuality is normally installed as the
    # bcquality plugin; external-multiroot needs a ../bcquality clone that is rarely there.
    # A missing plugin falls back to native review (fallback below), never blocks.
    mode: "plugin"
    # Select once per host/configuration; execute and evidence each review separately.
    # auto / true: discover the selected mode; true additionally expects availability.
    # false: no probe, load, execution or refresh; full native A-G.
    enabled: "auto"
    # Source of the knowledge base. Configurable: defaults to the canonical upstream
    # (microsoft/BCQuality). Override `url` to point at your own fork. The install
    # scripts read `url` / `ref` / `pinnedCommit` from here — this file is the single
    # source of truth.
    url: "https://github.com/microsoft/BCQuality.git"
    ref: "main"                           # branch/tag to track when pinnedCommit is empty
    pinnedCommit: ""                       # optional: set a 40-hex SHA for reproducible, pinned evidence
    home: "../bcquality"                  # external clone location (override: $BCQUALITY_HOME); external-multiroot only
    entryPoint: "skills/entry.md"         # relative to `home`
    # Used only with mode: plugin. Expectations do not install or prove identity.
    plugin:
      id: "bcquality"
      skill: "al-code-review"          # BCQuality >= 0.2.0 (renamed upstream in #150)
      expectedVersion: ""             # unset: any installed version is accepted and recorded as observed
      sourceRef: ""
    consumedBy: ["agents/al-reviewer.md", "agents/al-triage.md", "agents/al-knowledge-consultant.md"]
    # Missing/incompatible provider: native review, never an AL code defect.
    fallback:
      mode: "skills-mode"        # review natively via instructions + skills
      residual: "A-G"            # expand the native checklist from A/C/F/G to full A-G
      outcome: "not-applicable"  # the bcquality.outcome the agents record
      neverBlock: true           # a missing layer never fails/aborts the review
    # Empty = full corpus. Entry's own relevance/worklist decides what runs; a leaf
    # whose domain the diff does not touch returns not-applicable/no-knowledge cheaply.
    # Populate ONLY to exclude a leaf deliberately (multiroot policy; never a plugin denylist).
    pilotSkills: []
    evidence:
      # Resolved against plans.root, so a surface that relocates plans (the Claude
      # Code plugin uses .claude/plans) keeps its evidence with them.
      persistedReportGlob: "**/*-bcquality-phase-*.json"
      validator: "tools/bcquality/validate_evidence.py"

# Where requirement artifacts live. Every consumer reads this knob instead of
# hard-coding the folder: the Copilot deployment and the VS Code extension keep
# .github/plans; this plugin uses .claude/plans.
plans:
  root: ".claude/plans"

# Where /aldc:audit persists the audit reports of al-reviewer (scope audit). The second work-product folder, read the
# same way as plans.root and kept beside it (validate_evidence.py takes its
# --audits-dir default from here).
audits:
  root: ".claude/audits"

contracts:
  globalMemory: "memory.md"
  namingConvention: "{req_name}.{type}.md"
  types:
    - "spec"
    - "architecture"
    - "test-plan"
  # Relative to plans.root (an absolute-looking legacy value is still honoured).
  archiveFolder: "archive"

# Toolkit inventory, relative to the plugin root (toolkitRoot). aldc-validate resolves
# these from the directory it runs in, so they hold when it runs in the plugin root.
required:
  agents:
    - "agents/al-architect.md"
    - "agents/al-spec-agent.md"
    - "agents/al-conductor.md"
    - "agents/al-implementer.md"
    - "agents/al-reviewer.md"
    - "agents/al-triage.md"
    - "agents/al-knowledge-consultant.md"

  subagents:
    - "agents/al-researcher.md"

  # Deprecated aliases (5.4.0), removed in 6.0.0. Each delegates to the agent above.
  deprecatedAgents:
    - "agents/al-developer.md"
    - "agents/al-implement-subagent.md"
    - "agents/al-review-subagent.md"
    - "agents/al-developer-reviewer.md"
    - "agents/dredd.md"
    - "agents/al-planning-subagent.md"

  # Deprecated workflow alias (5.4.0), removed in 6.0.0: /aldc:al-spec-create -> /aldc:spec.
  deprecatedWorkflows:
    - "skills/al-spec-create/SKILL.md"

  workflows:
    - "skills/al-build/SKILL.md"
    - "skills/al-pr-prepare/SKILL.md"
    - "skills/al-memory-create/SKILL.md"
    - "skills/al-context-create/SKILL.md"
    - "skills/al-initialize/SKILL.md"

  skills:
    required:
      - "skills/skill-api/SKILL.md"
      - "skills/skill-copilot/SKILL.md"
      - "skills/skill-debug/SKILL.md"
      - "skills/skill-performance/SKILL.md"
      - "skills/skill-events/SKILL.md"
      - "skills/skill-permissions/SKILL.md"
      - "skills/skill-testing/SKILL.md"
      - "skills/skill-al-review-pipeline/SKILL.md"
    recommended:
      - "skills/skill-migrate/SKILL.md"
      - "skills/skill-pages/SKILL.md"
      - "skills/skill-translate/SKILL.md"

  # Path-scoped AL rules (the Copilot surface calls them instructions).
  instructions:
    - "rules/al-guidelines.md"
    - "rules/al-code-style.md"
    - "rules/al-naming-conventions.md"
    - "rules/al-performance.md"
    - "rules/al-error-handling.md"
    - "rules/al-events.md"
    - "rules/al-testing.md"
    - "rules/al-security.md"

  templates:
    - "docs/templates/spec-template.md"
    - "docs/templates/architecture-template.md"
    - "docs/templates/test-plan-template.md"
    - "docs/templates/memory-template.md"
    - "docs/templates/technical-spec-template.md"
    - "docs/templates/delivery-template.md"
    - "docs/templates/skill-template.md"

# Pre-sales and agent building (al-presales, al-agent-builder, the al-agent-* workflows, skill-estimation
# and skill-agent-*) ship in the optional aldc-extras plugin since 5.4.0. The al-agent-toolkit rule stays
# here: the implementer and reviewer apply it to apps that extend Agent Metadata Provider.
optional:
  skills:
    - "skills/skill-contribution-assistant/SKILL.md"
  instructions:
    - "rules/al-agent-toolkit.md"

validation:
  rules:
    missingPlansDir: "error"
    missingGlobalMemory: "error"
    missingTemplates: "error"
    missingToolkitFiles: "error"
    missingSkills: "error"
    copilotEntrypointCoherence: "warn"
    incompleteRequirementSets: "warn"
    missingRecommendedSkills: "warn"
    malformedAlFileName: "warn"
