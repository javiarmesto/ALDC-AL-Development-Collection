name: Validate Collection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate AL Collection
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run validation
      run: npm run validate
    - name: Surface generation isolation
      run: npm run test:surface-isolation
    - name: Codex profile syntax and discovery layout
      run: python3 scripts/test-codex.py
    - name: Canonical Doctor acceptance fixtures
      run: python3 -B scripts/test-doctor.py
    - name: Packaged distribution smoke test
      run: npm run test:package
    - name: Conformance check
      run: node scripts/check-conformance.js
    - name: Foundation drift check
      run: node scripts/sync-foundation.js --check

    - name: Claude workspace drift check
      run: node scripts/sync-claude-workspace.js --check
    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: |
          validation-report.txt
          validation-report.json
        retention-days: 30
        
    - name: Comment validation results on PR
      if: github.event_name == 'pull_request' && always()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // Run validation and capture output
          let output = '';
          try {
            output = execSync('npm run validate', { encoding: 'utf8' });
          } catch (error) {
            output = error.stdout + error.stderr;
          }
          
          // Create comment body
          const body = `## 📋 Collection Validation Results
          
          \`\`\`
          ${output}
          \`\`\`
          
          ${output.includes('✅ Collection is valid') ? '✅ Validation passed!' : '❌ Validation failed. Please review the errors above.'}
          `;
          
          // Post comment
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
