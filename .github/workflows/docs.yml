name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate MkDocs configuration
        run: |
          echo "Validating mkdocs.yml..."
          mkdocs build --verbose
      
      - name: Build and deploy docs
        run: mkdocs gh-deploy --force --verbose

      - name: Remove superseded documentation archives
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            for (const artifact of artifacts.filter(a => a.name === 'github-pages' &&
              Date.parse(a.created_at) < Date.parse(context.payload.head_commit?.timestamp || '1970-01-01'))) {
              await github.rest.actions.deleteArtifact({owner: context.repo.owner,
                repo: context.repo.repo, artifact_id: artifact.id});
            }
