name: ALDC Evidence Model

# Provider-neutral structural validation for persisted ALDC Review/Audit Reports.
# Deeper provider checks remain separate (for example BCQuality citation resolution).

on:
  pull_request:
    paths:
      - '.github/plans/**'
      - '.github/audits/**'
      - 'aldc.yaml'
      - 'docs/framework/ALDC-Evidence-Model-v1.md'
      - 'docs/schema/aldc-evidence.schema.json'
      - 'tools/evidence/**'
      - '.github/workflows/aldc-evidence.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate ALDC evidence
        run: python3 tools/evidence/validate_evidence.py
