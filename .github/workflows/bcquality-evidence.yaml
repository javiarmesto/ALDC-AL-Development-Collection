name: BCQuality Evidence

# Report structure is checked in every mode. Citation resolution needs the
# matching external corpus; plugin host loading/execution is not certified here.

on:
  pull_request:
    paths:
      - '.github/plans/**'
      - '.github/audits/**'
      - 'aldc.yaml'
      - 'tools/bcquality/**'
      - '.github/workflows/bcquality-evidence.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ALDC dependencies
        run: npm ci --ignore-scripts

      - name: Prepare optional multiroot corpus
        env:
          BCQUALITY_HOME: ${{ runner.temp }}/bcquality
        run: bash tools/bcquality/install.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate BCQuality evidence
        env:
          BCQUALITY_HOME: ${{ runner.temp }}/bcquality
        run: python3 tools/bcquality/validate_evidence.py
