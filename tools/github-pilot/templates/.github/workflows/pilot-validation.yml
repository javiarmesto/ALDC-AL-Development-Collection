name: Pilot structural validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate baseline
        if: github.event_name != 'pull_request'
        run: python scripts/verify-fixtures.py
      - name: Validate PR against trusted base fixtures and checker
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:scripts/verify-fixtures.py" > "$RUNNER_TEMP/verify-fixtures.py"
          git show "$BASE_SHA:scripts/check-phase.py" > "$RUNNER_TEMP/check-phase.py"
          git show "$BASE_SHA:pilot-lock.json" > "$RUNNER_TEMP/pilot-lock.json"
          git show "$BASE_SHA:.github/aldc-cloud-lock.json" > "$RUNNER_TEMP/cloud-lock.json"
          python "$RUNNER_TEMP/verify-fixtures.py" --root "$GITHUB_WORKSPACE" --lock "$RUNNER_TEMP/pilot-lock.json" --cloud-lock "$RUNNER_TEMP/cloud-lock.json"
          python "$RUNNER_TEMP/check-phase.py" --base "$BASE_SHA" --root "$GITHUB_WORKSPACE"
      - name: Record scope
        run: echo 'Integrity and phase checks only. AL build, BC runtime tests and manual A14 need their own evidence.' >> "$GITHUB_STEP_SUMMARY"
